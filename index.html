<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    .deal {
      border: 1px solid #ddd;
      padding: 15px;
      margin: 10px 0;
      border-radius: 12px;
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    }
    .spread { color: #00C853; font-weight: bold; font-size: 18px; }
    .price { font-size: 16px; }
    .limit { color: #888; }
    .online { background: #66cc66; color: #fff; padding: 4px 8px; border-radius: 4px; }
    .offline { background: #cc3333; color: #fff; padding: 4px 8px; border-radius: 4px; }
    .filters {
      margin-bottom: 20px;
      padding: 15px;
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      border-radius: 12px;
    }
    .filters label {
      margin-right: 15px;
    }
    .filters input {
      width: 80px;
      padding: 5px;
      margin-left: 5px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .filters button {
      padding: 8px 16px;
      background: #4285F4;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 10px;
    }
    .filters button:hover {
      background: #3367D6;
    }
  </style>
</head>
<body>
  <h2>🔥 P2P Сделки</h2>
  
  <div class="filters">
    <label>
      Спред > 
      <input type="number" id="minSpread" value="18" step="0.1"> %
    </label>
    <label>
      Мин. лимит ≤ 
      <input type="number" id="maxLimit" value="5000" step="100">
    </label>
    <button onclick="applyFilters()">Применить</button>
  </div>

  <div id="loading">Загрузка...</div>
  <div id="deals"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Глобальные данные
    let allDeals = [];

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result;
    }

    function parseNumber(str) {
      if (!str) return NaN;
      return parseFloat(str.replace(',', '.'));
    }

    function loadDeals() {
      fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vSYtCoCWnkrbziVbeg3htqL5mmh8_tfXxFf-uQ4K-Zs3lh8UIoN9olDELtiD02-dx5JBICjKmrif6XD/pub?gid=0&single=true&output=csv')
        .then(r => r.text())
        .then(csv => {
          document.getElementById('loading').style.display = 'none';

          const rows = csv.trim().split(/\r?\n/);
          const dataRows = rows.slice(5);

          allDeals = [];

          dataRows.forEach(row => {
            const cols = parseCSVLine(row);

            const nickname = cols[0] || '';
            const price = cols[1] || '';
            const minLimit = parseNumber(cols[2]);
            const spread = parseNumber(cols[5]);
            const online = (cols[7] || '').trim();

            if (nickname && !isNaN(spread) && !isNaN(minLimit)) {
              allDeals.push({
                nickname,
                price,
                minLimit,
                spread,
                online
              });
            }
          });

          applyFilters();
        })
        .catch(err => {
          console.error(err);
          document.getElementById('loading').textContent = 'Ошибка загрузки таблицы.';
        });
    }

    function applyFilters() {
      const minSpread = parseFloat(document.getElementById('minSpread').value) || 18;
      const maxLimit = parseFloat(document.getElementById('maxLimit').value) || 5000;

      let html = '';

      allDeals.forEach(deal => {
        if (deal.spread > minSpread && deal.minLimit <= maxLimit) {
          html += `
            <div class="deal">
              <b>${deal.nickname}</b>
              <span class="${deal.online === 'Online' ? 'online' : 'offline'}">${deal.online}</span><br>
              <span class="price">Цена: ${deal.price}</span> | 
              <span class="spread">Спред: ${deal.spread}%</span><br>
              <span class="limit">Мин. лимит: ${deal.minLimit}</span>
            </div>
          `;
        }
      });

      document.getElementById('deals').innerHTML = html || '<p>Подходящих сделок нет.</p>';
    }

    // Загрузить при старте
    loadDeals();

    // Автообновление каждые 30 секунд
    setInterval(loadDeals, 30000);
  </script>
</body>
</html>
