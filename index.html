<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    .deal {
      border: 1px solid #ddd;
      padding: 15px;
      margin: 10px 0;
      border-radius: 12px;
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    }
    .spread { color: #00C853; font-weight: bold; font-size: 18px; }
    .price { font-size: 16px; }
    .limit { color: #888; }
    .online { background: #66cc66; color: #fff; padding: 4px 8px; border-radius: 4px; }
    .offline { background: #cc3333; color: #fff; padding: 4px 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>🔥 P2P Сделки</h2>
  <div id="loading">Загрузка...</div>
  <div id="deals"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Загрузка данных из таблицы
    fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vSYtCoCWnkrbziVbeg3htqL5mmh8_tfXxFf-uQ4K-Zs3lh8UIoN9olDELtiD02-dx5JBICjKmrif6XD/pub?gid=0&single=true&output=csv')
      .then(r => r.text())
      .then(csv => {
        document.getElementById('loading').style.display = 'none';
        
        const rows = csv.split('\n').slice(4);
        let html = '';
        
        rows.forEach(row => {
          const cols = row.split(',');
          const nickname = cols[0];
          const price = cols[1];
          const minLimit = cols[2];
          const spread = cols[5];
          const online = cols[7];
          
          if (parseFloat(spread) > 18 && parseFloat(minLimit) <= 5000) {
            html += `
              <div class="deal">
                <b>${nickname}</b> <span class="${online === 'Online' ? 'online' : 'offline'}">${online}</span><br>
                <span class="price">Цена: ${price}</span> | 
                <span class="spread">Спред: ${spread}%</span><br>
                <span class="limit">Мин. лимит: ${minLimit}</span>
              </div>
            `;
          }
        });
        
        document.getElementById('deals').innerHTML = html;
      });
  </script>
</body>
</html>
