<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      margin: 0;
    }
    h2 {
      margin-top: 0;
    }
    .deal {
      border: 1px solid #ddd;
      padding: 15px;
      margin: 10px 0;
      border-radius: 12px;
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    }
    .spread { color: #00C853; font-weight: bold; font-size: 18px; }
    .price { font-size: 16px; }
    .limit { color: #888; font-size: 14px; }
    .online { background: #66cc66; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    .offline { background: #cc3333; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    #loading {
      text-align: center;
      padding: 20px;
      color: #888;
    }
    .last-update {
      font-size: 12px;
      color: #888;
      text-align: right;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h2>🔥 P2P Сделки!!</h2>
  <div class="last-update" id="lastUpdate"></div>
  <div id="loading">Загрузка...</div>
  <div id="deals"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result;
    }

    const CORS_PROXY = 'https://api.allorigins.win/raw?url=';
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSYtCoCWnkrbziVbeg3htqL5mmh8_tfXxFf-uQ4K-Zs3lh8UIoN9olDELtiD02-dx5JBICjKmrif6XD/pub?gid=0&single=true&output=csv';

    function loadDeals() {
      fetch(CORS_PROXY + encodeURIComponent(SHEET_URL))
        .then(r => {
          if (!r.ok) throw new Error('Network error');
          return r.text();
        })
        .then(csv => {
          document.getElementById('loading').style.display = 'none';

          const rows = csv.trim().split(/\r?\n/);
          const dataRows = rows.slice(5);

          let html = '';

          dataRows.forEach(row => {
            const cols = parseCSVLine(row);

            const nickname = cols[0] || '';
            const price = cols[1] || '';
            const minLimitRaw = (cols[2] || '').replace(/\s/g, '').replace(',', '.');
            const spreadRaw = (cols[5] || '').replace('%', '').replace(',', '.');
            const online = (cols[7] || '').trim();

            const minLimit = parseFloat(minLimitRaw);
            const spread = parseFloat(spreadRaw);

            if (nickname && !isNaN(spread) && !isNaN(minLimit) && spread > 18 && minLimit <= 5000) {
              html += `
                <div class="deal">
                  <b>${nickname}</b>
                  <span class="${online === 'Online' ? 'online' : 'offline'}">${online}</span><br>
                  <span class="price">Цена: ${price}</span> | 
                  <span class="spread">Спред: ${spread}%</span><br>
                  <span class="limit">Мин. лимит: ${minLimit}</span>
                </div>
              `;
            }
          });

          document.getElementById('deals').innerHTML = html || '<p>Подходящих сделок нет.</p>';
          
          // Показываем время последнего обновления
          const now = new Date();
          document.getElementById('lastUpdate').textContent = 
            'Обновлено: ' + now.toLocaleTimeString();
        })
        .catch(err => {
          console.error('Ошибка:', err);
          document.getElementById('loading').textContent = 'Ошибка: ' + err.message;
        });
    }

    // Загрузить сразу
    loadDeals();

    // Обновлять каждые 30 секунд
    setInterval(loadDeals, 30000);
  </script>
</body>
</html>
